<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tính tiền lương tháng</title>
    <link rel="stylesheet" href="Style/style.css" />
  </head>
  <body>
    <h1>Tính tiền lương tháng</h1>

    <form id="salaryForm">
      <table>
        <tr>
          <th scope="row"><label for="salary">Lương</label></th>
          <td>
            <input
              id="salary"
              name="salary"
              type="number"
              min="0"
              step="1"
              value="1000000"
              required
            />
          </td>
        </tr>
        <tr>
          <th scope="row"><label for="coefficient">Hệ số lương</label></th>
          <td>
            <input
              id="coefficient"
              name="coefficient"
              type="number"
              min="0"
              step="0.1"
              value="3.2"
              required
            />
          </td>
        </tr>
        <tr>
          <td class="action-cell" colspan="2">
            <button type="submit">Tính lương tháng</button>
          </td>
        </tr>
        <tr>
          <th scope="row"><label for="monthlySalary">Lương tháng</label></th>
          <td>
            <input
              id="monthlySalary"
              name="monthlySalary"
              type="text"
              readonly
            />
          </td>
        </tr>
      </table>
    </form>

    <script src="Script/cau23.js"></script>
  </body>
</html>
